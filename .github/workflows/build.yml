name: Build
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fonts
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip -OutFile inter.zip
          Expand-Archive inter.zip -DestinationPath inter
          New-Item -ItemType Directory -Force Shared/Fonts | Out-Null
          foreach ($w in "Regular","Medium","SemiBold","Bold") {
            $f = Get-ChildItem inter -Recurse -Filter "Inter-$w.ttf" | Select-Object -First 1
            if (-not $f) { throw "Inter-$w.ttf not found" }
            Copy-Item $f.FullName Shared/Fonts/
          }
          # Free stand-ins for the Mac fonts (SIL Open Font License; Arimo: Apache 2.0).
          $fonts = @{ "nunito"="Nunito"; "source-serif-4"="SourceSerif4"; "arimo"="Arimo"; "nunito-sans"="NunitoSans"; "jost"="Jost"; "playfair-display"="PlayfairDisplay" }
          foreach ($id in $fonts.Keys) {
            foreach ($w in 400,500,600,700) {
              $out = "Shared/Fonts/$($fonts[$id])-$w.ttf"
              Invoke-WebRequest "https://cdn.jsdelivr.net/fontsource/fonts/$id@latest/latin-$w-normal.ttf" -OutFile $out
              if ((Get-Item $out).Length -lt 10000) { throw "$id $w download failed" }
            }
          }
          $lic = Get-ChildItem inter -Recurse -Filter "LICENSE.txt" | Select-Object -First 1
          $credits = "Fonts in this app are free, open-source fonts:`r`nInter (rsms.me/inter), Nunito, Nunito Sans, Source Serif 4, Jost and Playfair Display (SIL Open Font License 1.1), and Arimo (Apache License 2.0).`r`n`r`nInter's license:`r`n`r`n"
          Set-Content Shared/Fonts/LICENSE.txt ($credits + (Get-Content $lic.FullName -Raw))
          Get-ChildItem Shared/Fonts
      - name: Tests
        run: dotnet run --project Tests/Tests.csproj -c Release
      - name: Publish
        run: |
          dotnet publish Lune/Lune.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/Lune
          dotnet publish Vers/Vers.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/Vers
      - name: Snapshots
        shell: pwsh
        run: |
          $p = Start-Process publish/Lune/Lune.exe -ArgumentList "--snapshot","snapshots" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Lune snapshot failed" }
          $p = Start-Process publish/Vers/Vers.exe -ArgumentList "--snapshot","snapshots" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Vers snapshot failed" }
          Get-ChildItem snapshots
      - name: Launch test
        shell: pwsh
        run: |
          $failed = $false
          foreach ($app in "Lune","Vers") {
            $log = Join-Path $env:APPDATA "$app\crash.log"
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process "publish/$app/$app.exe" -PassThru
            Start-Sleep -Seconds 15
            $alive = -not $p.HasExited
            Write-Host "$app running after 15s: $alive"
            if (Test-Path $log) { Write-Host "---- $app crash.log ----"; Get-Content $log; $failed = $true }
            if (-not $alive) { Write-Host "$app exited with code $($p.ExitCode)"; $failed = $true } else { Stop-Process -Id $p.Id -Force }
          }
          if ($failed) { throw "An app failed to start" }
      - name: Installers
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer/Lune.iss
          & $iscc installer/Vers.iss
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: out
